name: Visual Story Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-story-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: static-and-browser-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt
      - name: Python / link / translation checks
        run: |
          python community/scripts/test_skill.py
          python community/scripts/test_i18n.py
          python tests/static_integrity.py
      - name: JavaScript syntax checks
        run: |
          node --check community/assets/starter-site/app.js
          node --check community/assets/starter-site/i18n.js
          node --check community/assets/starter-site/showcase/showcase.js
      - name: Install tested browser runner
        run: |
          python -m pip install -r tests/requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Browser E2E (real HTTP)
        run: python tests/browser_smoke.py --mode http
